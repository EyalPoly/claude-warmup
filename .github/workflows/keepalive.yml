name: Keepalive

# GitHub auto-disables scheduled workflows after 60 days with no repo
# activity, and scheduled runs don't count as activity. Calling the
# "enable workflow" API resets that timer without needing a commit, which
# matters because main only accepts changes through pull requests. This
# workflow re-enables itself too, since it is scheduled and would
# otherwise be disabled by the same rule.

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch: {}

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for workflow in warmup.yml keepalive.yml; do
            gh api --method PUT "repos/$GH_REPO/actions/workflows/$workflow/enable"
            echo "Enabled $workflow"
          done
